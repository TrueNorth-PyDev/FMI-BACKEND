components:
  schemas:
    AdminCapitalActivity:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        activity_type:
          enum:
          - INITIAL_INVESTMENT
          - CAPITAL_CALL
          - DISTRIBUTION
          - PARTIAL_EXIT
          - FULL_EXIT
          type: string
          description: |-
            * `INITIAL_INVESTMENT` - Initial Investment
            * `CAPITAL_CALL` - Capital Call
            * `DISTRIBUTION` - Distribution
            * `PARTIAL_EXIT` - Partial Exit
            * `FULL_EXIT` - Full Exit
          x-spec-enum-id: e73bb160387904f5
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
          description: Amount (negative for calls/investments, positive for distributions)
        date:
          type: string
          format: date
          description: Activity date
        details:
          type: string
          description: Activity description
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - activity_type
      - amount
      - created_at
      - date
      - id
    AdminCapitalActivityRequest:
      type: object
      properties:
        activity_type:
          enum:
          - INITIAL_INVESTMENT
          - CAPITAL_CALL
          - DISTRIBUTION
          - PARTIAL_EXIT
          - FULL_EXIT
          type: string
          description: |-
            * `INITIAL_INVESTMENT` - Initial Investment
            * `CAPITAL_CALL` - Capital Call
            * `DISTRIBUTION` - Distribution
            * `PARTIAL_EXIT` - Partial Exit
            * `FULL_EXIT` - Full Exit
          x-spec-enum-id: e73bb160387904f5
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
          description: Amount (negative for calls/investments, positive for distributions)
        date:
          type: string
          format: date
