openapi: 3.0.3
info:
  title: PrivCap Hub API
  version: 1.0.0
  description: "\n    Comprehensive API for PrivCap Hub - A Private Capital Investment
    Management Platform\n    \n    ## Features\n    - **Authentication**: JWT-based
    authentication with email verification\n    - **Portfolio Management**: Track
    investments, capital activities, and performance\n    - **Marketplace**: Browse
    and watchlist investment opportunities\n    - **Ownership Transfers**: Manage
    investment ownership transfers\n    - **Account Management**: Profile, security,
    documents, and activity tracking\n    - **Investor Network**: Connect with other
    investors and view profiles\n    \n    ## Authentication\n    Most endpoints require
    JWT authentication. Obtain tokens via the `/api/accounts/login/` endpoint.\n    Include
    the token in requests using the `Authorization: Bearer <token>` header.\n    "
  contact:
    name: PrivCap Hub Support
    email: support@privcaphub.com
  license:
    name: Proprietary
